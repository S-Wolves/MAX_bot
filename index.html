<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кейтеринбург — Пропуск</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .points {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .point-btn {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .point-btn.selected {
            background: #007aff;
            border-color: #007aff;
            color: white;
        }
        .point-address {
            font-weight: 600;
        }
        .point-note {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            font-family: monospace;
            text-transform: uppercase;
        }
        input:focus {
            outline: none;
            border-color: #007aff;
        }
        button.submit {
            width: 100%;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button.submit:disabled {
            background: #ccc;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.loading {
            background: #e2f0ff;
            color: #004085;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
        .footer {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚚 РУДН</h1>
    <div class="subtitle">Оформление пропуска для въезда</div>

    <div class="points">
        <button class="point-btn" data-point="mm6" data-name="Миклухо-Маклая, д.6">
            <div class="point-address">📍 Миклухо-Маклая, д.6</div>
            <div class="point-note">Въезд в подземную парковку</div>
        </button>
        <button class="point-btn" data-point="mm10k2" data-name="Миклухо-Маклая, д.10к2">
            <div class="point-address">📍 Миклухо-Маклая, д.10к2</div>
        </button>
        <button class="point-btn" data-point="ordzhonikidze" data-name="Орджоникидзе, д.3">
            <div class="point-address">📍 Орджоникидзе, д.3</div>
        </button>
    </div>

    <div class="input-group">
        <label>🚛 Номер автомобиля</label>
        <input type="text" id="plate" placeholder="Например: А123ВС777" maxlength="12" autocomplete="off">
    </div>

    <button class="submit" id="submitBtn">Оформить пропуск</button>
    <div id="status" class="status" style="display: none;"></div>
    <hr>
    <div class="footer">
        Пропуск действует 24 часа<br>
        После оформления схема проезда и контакты придут в чат
    </div>
</div>

<script>
    // Получаем параметры из URL (для диплинков)
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('start_param'); // для MAX: payload из startapp

    // Элементы
    const pointBtns = document.querySelectorAll('.point-btn');
    const plateInput = document.getElementById('plate');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    let selectedPoint = null;
    let selectedPointName = null;

    // Автоматическое преобразование в заглавные
    plateInput.addEventListener('input', function(e) {
        this.value = this.value.toUpperCase();
    });

    // Предзаполнение номера из диплинка (если передан)
    if (startParam && startParam.match(/^[АВЕКМНОРСТУХ0-9]{7,9}$/i)) {
        plateInput.value = startParam.toUpperCase();
    }

    // Выбор точки
    pointBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Убираем выделение у всех
            pointBtns.forEach(b => b.classList.remove('selected'));
            // Выделяем текущую
            btn.classList.add('selected');
            selectedPoint = btn.dataset.point;
            selectedPointName = btn.dataset.name;
        });
    });

    // Отправка заявки
    submitBtn.addEventListener('click', async () => {
        const plate = plateInput.value.trim().replace(/\s+/g, '').replace(/-/g, '');
        
        if (!selectedPoint) {
            showStatus('Пожалуйста, выберите точку разгрузки', 'error');
            return;
        }
        
        if (!plate) {
            showStatus('Пожалуйста, введите номер автомобиля', 'error');
            return;
        }
        
        // Простая валидация формата (буква, 3 цифры, 2-3 буквы, 2-3 цифры)
        const plateRegex = /^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2,3}\d{2,3}$/i;
        if (!plateRegex.test(plate)) {
            showStatus('Неверный формат номера. Пример: А123ВС777', 'error');
            return;
        }
        
        submitBtn.disabled = true;
        showStatus('Отправка заявки...', 'loading');
        
        try {
            // Отправляем данные на ваш бот
            const response = await fetch('/api/request-pass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    point_key: selectedPoint,
                    point_name: selectedPointName,
                    car_number: plate
                })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showStatus('✅ Заявка отправлена! Пропуск оформлен на 24 часа.', 'success');
                // Очищаем выделение точки
                pointBtns.forEach(b => b.classList.remove('selected'));
                selectedPoint = null;
                // Не очищаем номер, чтобы можно было отправить повторно
            } else {
                showStatus(result.error || 'Ошибка при отправке', 'error');
            }
        } catch (err) {
            showStatus('Ошибка соединения с сервером', 'error');
            console.error(err);
        } finally {
            submitBtn.disabled = false;
        }
    });
    
    function showStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = `status ${type}`;
        statusDiv.style.display = 'block';
        setTimeout(() => {
            if (statusDiv.className === `status ${type}`) {
                statusDiv.style.display = 'none';
            }
        }, 3000);
    }
</script>
</body>
</html>
