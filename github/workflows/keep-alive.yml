name: Keep Render Alive

on:
  schedule:
    # Запускаем каждые 14 минут (в часы, когда может быть активность)
    - cron: '*/14 * * * *'
  workflow_dispatch:  # позволяет запустить вручную из интерфейса GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping main app
        run: |
          echo "Пингую https://max-bot-qxmj.onrender.com"
          curl -I -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://max-bot-qxmj.onrender.com
      
      - name: Ping greeting bot health check
        run: |
          echo "Пингую health-чек бота (если есть)"
          curl -I -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://max-bot-qxmj.onrender.com/health || true